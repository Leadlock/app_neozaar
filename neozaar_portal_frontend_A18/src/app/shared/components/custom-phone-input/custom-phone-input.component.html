<div class="flex flex-col  ">
  <div class=" rounded-2xl  ">
  

    <!-- Unified Input -->
    <div class="relative">
      <input
        type="text"
        [(ngModel)]="inputValue"
        (input)="onInputChange()"
        (keypress)="allowOnlyValidKeys($event)"
       
        (blur)="validateNumber()"
        placeholder="e.g. +91 9876543210 or India"
        class="w-full border border-gray-400 rounded-lg py-3 px-3 text-sm text-gray-700 focus:outline-none focus:ring-2"
      />

      <!-- Dropdown -->
      <ul
        *ngIf="showDropdown"
        class="absolute z-10 left-0 right-0 bg-white border border-gray-300 rounded-lg mt-1 max-h-52 overflow-y-auto shadow-md"
      >
        <li
          *ngFor="let c of filteredCountries"
          (click)="selectCountry(c)"
          class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-sm flex items-center gap-2"
        >
          <span>{{ c.flag }}</span>
          <span>{{ c.name }}</span>
          <span class="ml-auto text-gray-500">{{ c.code }}</span>
        </li>
      </ul>
    </div>

    <!-- Validation -->
    <p
      class="mt-4 text-center text-sm font-medium"
      [ngClass]="{
        'text-green-600': validationMessage.startsWith('✅'),
        'text-orange-500': validationMessage.startsWith('⚠️')
      }"
    >
      {{ validationMessage }}
    </p>
  </div>
</div>
