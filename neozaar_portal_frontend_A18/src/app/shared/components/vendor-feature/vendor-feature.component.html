<div class="bg-[#0f0f11] border border-white/10 rounded-3xl p-6 w-full max-w-md">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h4 class="text-white font-bold text-lg">Feature Status</h4>
      <p class="text-slate-500 text-xs uppercase tracking-wider">Visibility Settings</p>
    </div>
    
    <button (click)="toggleEdit()" 
            class="text-xs font-bold px-4 py-2 rounded-full border transition-all"
            [ngClass]="isEditing ? 'border-red-500/50 text-red-500 hover:bg-red-500/10' : 'border-orange-600 text-orange-600 hover:bg-orange-600 hover:text-white'">
      {{ isEditing ? 'CANCEL' : 'EDIT' }}
    </button>
  </div>

  <div *ngIf="!isEditing" class="flex items-center gap-4 animate-in fade-in duration-500">
    <div [ngClass]="isFeature ? 'bg-green-500/10 text-green-500' : 'bg-slate-500/10 text-slate-400'"
         class="px-6 py-3 rounded-2xl border border-white/5 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full" [ngClass]="isFeature ? 'bg-green-500 animate-pulse' : 'bg-slate-500'"></span>
      <span class="font-black text-sm uppercase">{{ isFeature ? 'Featured' : 'Standard' }}</span>
    </div>
    <p class="text-slate-500 text-sm">This item is currently {{ isFeature ? 'promoted' : 'hidden' }} from the homepage.</p>
  </div>

  <div *ngIf="isEditing" class="space-y-4 animate-in slide-in-from-bottom-2 duration-300">
    <p class="text-slate-400 text-sm mb-2">Select new feature status:</p>
    <div class="flex bg-white/5 p-1.5 rounded-2xl border border-white/10 relative overflow-hidden">
      
      <button 
        (click)="updateFeature(true)"
        [disabled]="loading"
        class="flex-1 py-3 px-6 rounded-xl font-black text-sm transition-all z-10"
        [ngClass]="isFeature ? 'bg-orange-600 text-white shadow-lg shadow-orange-600/20' : 'text-slate-500 hover:text-white'">
        <span *ngIf="!loading || isFeature">YES, FEATURE</span>
        <span *ngIf="loading && isFeature" class="animate-spin inline-block ml-2">↻</span>
      </button>

      <button 
        (click)="updateFeature(false)"
        [disabled]="loading"
        class="flex-1 py-3 px-6 rounded-xl font-black text-sm transition-all z-10"
        [ngClass]="!isFeature ? 'bg-white/10 text-white border border-white/10' : 'text-slate-500 hover:text-white'">
        <span *ngIf="!loading || !isFeature">NO, REMOVE</span>
        <span *ngIf="loading && !isFeature" class="animate-spin inline-block ml-2">↻</span>
      </button>
    </div>
  </div>
</div>
