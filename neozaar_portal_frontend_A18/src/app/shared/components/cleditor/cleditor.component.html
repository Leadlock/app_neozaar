<div class="cleditor-container" [class.disabled]="disabled">
  <!-- CLEditor Implementation -->
  @if (!showFallback) {
    <!-- Original CLEditor textarea -->
    <textarea #editorRef
              [id]="editorId"
              [placeholder]="placeholder"
              [disabled]="disabled"
              style="display: none;"></textarea>
    
    <!-- Paste warning -->
    @if (showPasteWarning) {
      <div class="paste-warning">
        <i class="warning-icon">⚠️</i>
        <span class="text-sm">{{ warningMessage }}</span>
      </div>
    }
    
    <!-- Image upload progress -->
    @if (isUploadingImage) {
      <div class="upload-progress">
        <div class="progress-bar">
          <div class="progress-fill" [style.width]="uploadProgress + '%'"></div>
        </div>
        <span class="progress-text">Uploading: {{ uploadProgress }}%</span>
      </div>
    }
  }
  
  <!-- Fallback Editor (when CLEditor is not available) -->
  @if (showFallback) {
    <div class="fallback-editor">
      <div class="toolbar">
        <button type="button" (click)="formatText('bold')" title="Bold" [disabled]="disabled">
          <strong>B</strong>
        </button>
        <button type="button" (click)="formatText('italic')" title="Italic" [disabled]="disabled">
          <em>I</em>
        </button>
        <button type="button" (click)="formatText('underline')" title="Underline" [disabled]="disabled">
          <u>U</u>
        </button>
        <button type="button" (click)="formatText('insertUnorderedList')" title="Bullet List" [disabled]="disabled">
          ••
        </button>
        <button type="button" (click)="formatText('insertOrderedList')" title="Numbered List" [disabled]="disabled">
          1.
        </button>
        <button type="button" (click)="formatText('justifyLeft')" title="Align Left" [disabled]="disabled">
          ⎸=
        </button>
        <button type="button" (click)="formatText('justifyCenter')" title="Align Center" [disabled]="disabled">
          =⎸=
        </button>
        <button type="button" (click)="formatText('justifyRight')" title="Align Right" [disabled]="disabled">
          =⎸
        </button>
        <button type="button" (click)="insertFallbackImage()" title="Insert Image" [disabled]="disabled">
          🖼️
        </button>
        <input #imageInput type="file" accept="image/*" (change)="handleFallbackImageUpload($event)" style="display: none;">
      </div>
      
      <div #fallbackContent
           class="fallback-content"
           contenteditable="true"
           [innerHTML]="value"
           (input)="handleFallbackInput()"
           (paste)="handleFallbackPaste($event)"
           (drop)="$event.preventDefault()"
           (dragover)="$event.preventDefault()"
           (blur)="onTouched()"
           [attr.placeholder]="placeholder"
           [attr.disabled]="disabled"
           [attr.contenteditable]="!disabled"></div>
      
      <!-- Paste warning for fallback -->
      @if (showPasteWarning) {
        <div class="paste-warning">
          <i class="warning-icon">⚠️</i>
          <span>{{ warningMessage }}</span>
        </div>
      }
      
      <!-- Image upload progress for fallback -->
      @if (isUploadingImage) {
        <div class="upload-progress">
          <div class="progress-bar">
            <div class="progress-fill" [style.width]="uploadProgress + '%'"></div>
          </div>
          <span class="progress-text">Uploading: {{ uploadProgress }}%</span>
        </div>
      }
    </div>
  }
</div>
