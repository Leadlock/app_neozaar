<main class="min-h-screen bg-black flex items-center justify-center px-6 text-white">
  <div class="text-center">
    <span class="inline-block h-8 w-8 animate-spin rounded-full border-2 border-orange-400 border-t-transparent"></span>
    <p class="mt-4 text-sm text-zinc-400">Taking you to Neozaar sign in…</p>
    <a [href]="frontendUrl + 'auth/login'" class="mt-3 inline-block text-sm font-semibold text-orange-400 underline">
      Continue to sign in
    </a>
  </div>
</main>
