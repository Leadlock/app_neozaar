<section>
  <!-- HEADER -->
  <div class="flex justify-between items-end">
    <div>
      <h1 class="text-2xl font-semibold">Customer</h1>
    </div>

    <div class="flex items-center gap-3">
      <!-- @if(currentUserRole === 'ADMIN'){
      <app-excel-upload></app-excel-upload>
      <button (click)="downloadExcel()" class="px-2 py-1 rounded-md bg-green-200 text-green-800">
        <i class="ri-download-cloud-line"></i>
      </button>
      } -->

      <a routerLink="create" class="btn btn-sm bg-white font-semibold text-sm flex items-center gap-1" role="button">
        <i class="ri-add-line"></i> Create <i class="ri-instance-line"></i>
      </a>
    </div>
  </div>

  <!-- FILTER FORM -->
  <form>
    <div class="flex flex-wrap justify-between items-center mt-5 gap-3">
      <div class="flex flex-wrap items-center gap-3">


      </div>




    </div>
  </form>

  <!-- PRODUCTS TABLE -->
  <div class="p-5 max-w-screen-2xl bg-white rounded-lg mt-5 border">
    <div class="overflow-x-auto">
      <table class="table table-auto w-full">
        <thead>
          <tr class="border-blue-900 text-blue-900">
            <th>Sr no</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <!-- <th>Owner Name</th> -->
            <th>Action</th>
          </tr>
        </thead>
<tbody>
<tr *ngFor="let user of users; let i = index">

<td>{{ (pagination.page - 1) * pagination.limit + i + 1 }}</td>

<td>{{ user.name }}</td>

<td>{{ user.email }}</td>



<td>{{ user.mobile }}</td>

<td>
 <button (click)="deleteUser(user.id)"
              class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 p-2.5 rounded-xl text-center transition-colors"
              title="Delete">
              <i class="ri-delete-bin-line text-xl"></i>
            </button>
</td>

</tr>
</tbody>
    
      </table>

     
      <div class="flex justify-end mt-4 gap-2">

<button
  class="px-3 py-1 border rounded"
  (click)="changePage(pagination.prev_page)"
  [disabled]="!pagination.prev_page"
>
Prev
</button>

<button
  *ngFor="let page of pagination.pages"
  (click)="changePage(page)"
  class="px-3 py-1 border rounded"
  [ngClass]="{'bg-blue-500 text-white': page === pagination.page}"
>
{{page}}
</button>

<button
  class="px-3 py-1 border rounded"
  (click)="changePage(pagination.next_page)"
  [disabled]="!pagination.next_page"
>
Next
</button>

</div>

    <!-- Modal box -->



  </div>
