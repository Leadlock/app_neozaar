<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - NeoZaar</title>
    <style>
        :root {
            --primary-color: #f97316;
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: -1px;
        }
        .logo-text span {
            color: var(--primary-color);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: rgba(249, 115, 22, 0.1);
            color: var(--primary-color);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(249, 115, 22, 0.2);
        }
        .footer {
            margin-top: 60px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo-text">Neo<span>Zaar</span></div>
        </div>
        <div class="status-badge">Maintenance Mode</div>
        <h1>We'll be back soon!</h1>
        <p>NeoZaar is currently undergoing scheduled maintenance to improve our services. We'll be back online shortly. Thank you for your patience!</p>
        <div class="footer">
            &copy; 2026 NeoZaar. All rights reserved.
        </div>
    </div>
    <script>
        // If the user lands here by mistake during a connection glitch,
        // this will automatically bring them back to the app once stable.
        function checkSite() {
            if (navigator.onLine) {
                // Try to go back to the main site
                window.location.href = 'https://www.neozaar.com/';
            }
        }
        // Check every 10 seconds while on maintenance page
        setInterval(checkSite, 10000);
    </script>
</body>
</html>
